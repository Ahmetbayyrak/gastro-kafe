<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gastro Kafe - Stok & Reçete Takip</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md text-center sticky top-0 z-50">
        <h1 class="text-xl font-bold">Gastro Kafe - Canlı Stok & Reçete</h1>
        <div id="status-badge" class="mt-1 text-xs bg-indigo-800 text-indigo-200 inline-block px-3 py-1 rounded-full">
            Bağlanıyor...
        </div>
    </header>

    <div class="max-w-md mx-auto p-4 space-y-6">

        <!-- STOK YÖNETİMİ -->
        <section class="bg-white p-4 rounded-xl shadow">
            <h2 class="text-lg font-bold mb-3 border-b pb-2 text-indigo-700">📦 Stok Ekle / Güncelle</h2>
            <form id="stok-form" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Ürün / Malzeme Adı</label>
                    <input type="text" id="stok-ad" required placeholder="Örn: Süt, Kahve Çekirdeği" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Miktar</label>
                        <input type="number" step="0.01" id="stok-miktar" required placeholder="Örn: 10" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Birim</label>
                        <select id="stok-birim" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Kg">Kg</option>
                            <option value="Litre">Litre</option>
                            <option value="Adet">Adet</option>
                            <option value="Gram">Gram</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg transition">
                    Stok Kaydet / Güncelle
                </button>
            </form>
        </section>

        <!-- STOK LİSTESİ -->
        <section class="bg-white p-4 rounded-xl shadow">
            <h2 class="text-lg font-bold mb-3 border-b pb-2 text-indigo-700">📊 Canlı Stok Listesi</h2>
            <div id="stok-listesi" class="space-y-2 text-sm text-gray-600">
                Veriler yükleniyor...
            </div>
        </section>

    </div>

    <!-- Firebase Bağlantı Kodu -->
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCSwg7TWH__ZaPVlvpFOI3s_mUJn0mhUfk",
            authDomain: "gastro-kafe.firebaseapp.com",
            projectId: "gastro-kafe",
            storageBucket: "gastro-kafe.firebasestorage.app",
            messagingSenderId: "223854582314",
            appId: "1:223854582314:web:01f43b7592765b3a6ac153",
            measurementId: "G-FVPYJ7GGBH",
            databaseURL: "https://gastro-kafe-default-rtdb.firebaseio.com"
        };

        // Firebase Başlat
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const stokRef = database.ref('stoklar');

        const statusBadge = document.getElementById('status-badge');
        const stokForm = document.getElementById('stok-form');
        const stokListesi = document.getElementById('stok-listesi');

        // Bağlantı Durumu
        database.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                statusBadge.textContent = '🟢 Canlı Ortak Bağlantı Aktif';
                statusBadge.className = 'mt-1 text-xs bg-green-800 text-green-200 inline-block px-3 py-1 rounded-full';
            } else {
                statusBadge.textContent = '🔴 Bağlantı Kesildi / Bekleniyor';
                statusBadge.className = 'mt-1 text-xs bg-red-800 text-red-200 inline-block px-3 py-1 rounded-full';
            }
        });

        // Stok Ekle / Güncelle
        stokForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const ad = document.getElementById('stok-ad').value.trim();
            const miktar = parseFloat(document.getElementById('stok-miktar').value);
            const birim = document.getElementById('stok-birim').value;

            if (ad && !isNaN(miktar)) {
                stokRef.child(ad).set({
                    miktar: miktar,
                    birim: birim,
                    guncellemeTarihi: new Date().toLocaleString('tr-TR')
                }).then(() => {
                    stokForm.reset();
                }).catch((err) => {
                    alert("Veri kaydedilemedi: " + err.message);
                });
            }
        });

        // Canlı Veri Dinleyici (Tüm cihazlarda anında güncellenir)
        stokRef.on('value', (snapshot) => {
            stokListesi.innerHTML = '';
            const data = snapshot.val();

            if (!data) {
                stokListesi.innerHTML = '<p class="text-gray-400 italic">Henüz stok girilmemiş.</p>';
                return;
            }

            for (let urunAdi in data) {
                const urun = data[urunAdi];
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-200';
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-gray-800 block">${urunAdi}</span>
                        <span class="text-xs text-gray-400">${urun.guncellemeTarihi || ''}</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full text-sm">
                            ${urun.miktar} ${urun.birim}
                        </span>
                        <button onclick="stokSil('${urunAdi}')" class="text-red-500 hover:text-red-700 font-bold text-xs bg-red-50 p-2 rounded">
                            Sil
                        </button>
                    </div>
                `;
                stokListesi.appendChild(div);
            }
        });

        // Stok Sil
        window.stokSil = function(urunAdi) {
            if (confirm(`${urunAdi} stoktan silinsin mi?`)) {
                stokRef.child(urunAdi).remove();
            }
        };
    </script>
</body>
</html>
